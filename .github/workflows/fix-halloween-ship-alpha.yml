name: Fix Halloween ship alpha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-halloween-ship-alpha.yml'

permissions:
  contents: write

jobs:
  fix-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Remove black background and normalize atlas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import cv2

          path = Path("assets/ships/events/halloween/galeão_halloween.webp")
          img = Image.open(path).convert("RGB")
          arr = np.array(img)
          mx = arr.max(axis=2)

          # Identify the dark background by connectivity to the image borders.
          # This preserves dark/black details enclosed by the ship artwork.
          background = np.zeros(mx.shape, dtype=bool)
          for threshold in (12, 16, 20, 24):
              candidate = (mx <= threshold).astype(np.uint8)
              _, labels = cv2.connectedComponents(candidate, connectivity=8)
              border = np.concatenate((labels[0, :], labels[-1, :], labels[:, 0], labels[:, -1]))
              border_labels = np.unique(border)
              background |= np.isin(labels, border_labels) & candidate.astype(bool)

          foreground = ~background

          # Drop only tiny isolated compression specks.
          count, labels, stats, _ = cv2.connectedComponentsWithStats(
              foreground.astype(np.uint8), connectivity=8
          )
          keep = np.zeros(count, dtype=bool)
          if count > 1:
              keep[1:] = stats[1:, cv2.CC_STAT_AREA] >= 20
          foreground = keep[labels]

          alpha = foreground.astype(np.uint8) * 255
          feathered = cv2.GaussianBlur(alpha, (0, 0), sigmaX=0.55, sigmaY=0.55)
          alpha = np.where(alpha == 255, np.maximum(feathered, 245), feathered).astype(np.uint8)
          alpha[alpha < 8] = 0

          rgba = np.dstack((arr, alpha))
          out = Image.fromarray(rgba, "RGBA").resize((1600, 1600), Image.Resampling.LANCZOS)
          out.save(path, "WEBP", quality=85, method=6, lossless=False)

          check = Image.open(path)
          assert check.size == (1600, 1600), check.size
          assert check.mode == "RGBA", check.mode
          assert check.getchannel("A").getextrema()[0] == 0, "alpha channel has no transparency"
          print(f"saved {path} | {path.stat().st_size} bytes | {check.mode} {check.size}")
          PY

      - name: Commit corrected asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/ships/events/halloween/galeão_halloween.webp"
          git diff --cached --quiet && exit 0
          git commit -m "fix(asset): remove Halloween galleon background"
          git push
