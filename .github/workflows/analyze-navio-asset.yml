name: Analyze navio asset

on:
  push:
    branches: [main]
    paths:
      - "assets/ships/navio.webp"
      - ".github/workflows/analyze-navio-asset.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Analyze sprite atlas
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import json, os, math

          src="assets/ships/navio.webp"
          img=Image.open(src).convert("RGBA")
          w,h=img.size
          cols=4 if w%4==0 else 1
          rows=4 if h%4==0 else 1
          cw=w//cols
          ch=h//rows

          frames=[]
          for idx in range(cols*rows):
              c=idx%cols; r=idx//cols
              cell=img.crop((c*cw,r*ch,(c+1)*cw,(r+1)*ch))
              a=cell.getchannel("A")
              bbox=a.getbbox()
              opaque=sum(1 for v in a.getdata() if v>8)
              frames.append({
                  "frame":idx,
                  "row":r,
                  "col":c,
                  "x":c*cw,
                  "y":r*ch,
                  "width":cw,
                  "height":ch,
                  "alpha_bbox":list(bbox) if bbox else None,
                  "opaque_ratio":round(opaque/(cw*ch),6)
              })

          max_side=1200
          scale=min(1.0,max_side/max(w,h))
          preview=img.resize((round(w*scale),round(h*scale)),Image.Resampling.LANCZOS)
          d=ImageDraw.Draw(preview)
          pcw=preview.width/cols; pch=preview.height/rows
          for c in range(1,cols):
              x=round(c*pcw); d.line((x,0,x,preview.height),fill=(255,0,255,255),width=3)
          for r in range(1,rows):
              y=round(r*pch); d.line((0,y,preview.width,y),fill=(255,0,255,255),width=3)
          for idx in range(cols*rows):
              c=idx%cols; r=idx//cols
              x=round(c*pcw+10); y=round(r*pch+10)
              d.rectangle((x-4,y-4,x+54,y+30),fill=(0,0,0,190))
              d.text((x,y),str(idx),fill=(255,255,0,255))
          os.makedirs("analysis",exist_ok=True)
          preview.save("analysis/navio_contact_sheet.png",optimize=True)
          jpg=Image.new("RGB",preview.size,(235,235,235))
          jpg.paste(preview,mask=preview.getchannel("A"))
          if max(jpg.size)>800:
              sc=800/max(jpg.size)
              jpg=jpg.resize((round(jpg.width*sc),round(jpg.height*sc)),Image.Resampling.LANCZOS)
          jpg.save("analysis/navio_contact_sheet.jpg",quality=72,optimize=True)
          meta={
              "source":src,
              "width":w,
              "height":h,
              "mode":"RGBA",
              "has_alpha":img.getextrema()[3] != (255,255),
              "columns":cols,
              "rows":rows,
              "cell_width":cw,
              "cell_height":ch,
              "frames":frames
          }
          with open("analysis/navio_meta.json","w",encoding="utf-8") as f:
              json.dump(meta,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/navio_contact_sheet.png analysis/navio_contact_sheet.jpg analysis/navio_meta.json
          if git diff --cached --quiet; then
            echo "No analysis changes"
          else
            git commit -m "chore: analyze navio sprite atlas"
            git push
          fi
