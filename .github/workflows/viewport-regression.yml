name: Viewport Regression

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check world runtime syntax
        run: node --check src/world/WorldRuntime.js

      - name: Run viewport and sprite regression tests
        run: node --test tests/viewport-width.test.mjs tests/world-sprite-animation.test.mjs tests/dev-dynamic-versioning.test.mjs
