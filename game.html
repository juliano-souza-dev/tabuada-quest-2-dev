<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081b2b">
  <meta name="application-name" content="Tabuada Quest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabuada Quest">
  <meta name="format-detection" content="no">
  <meta name="tq-build" content="dev-dynamic">
  <link rel="apple-touch-icon" href="./assets/pwa/icon-192.svg">
  <script>
    (() => {
      const stamp=Date.now();
      globalThis.__TQ_DEV_STAMP__=stamp;
      const versioned=path=>path+(path.includes("?")?"&":"?")+"v="+stamp;
      const buildMeta=document.querySelector('meta[name="tq-build"]');
      if(buildMeta)buildMeta.content=String(stamp);

      const manifest=document.createElement("link");
      manifest.rel="manifest";
      manifest.href=versioned("./manifest.webmanifest");
      document.head.append(manifest);

    })();
  </script>
  <title>Tabuada Quest</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const stamp=globalThis.__TQ_DEV_STAMP__||Date.now();
    globalThis.__TQ_DEV_STAMP__=stamp;
    await import("./src/pwa-entry.js?v="+stamp);
  </script>
</body>
</html>
